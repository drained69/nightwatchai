# NIGHTWATCH AI · local production stack.
# Bring up with:  docker compose up --build
# Data persists in ./data (mounted).

services:
  nightwatch:
    build: .
    image: nightwatch-ai:local
    container_name: nightwatch
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # ---- required in production ----
      JWT_SECRET: "${JWT_SECRET:-change_me_use_openssl_rand_base64_48}"
      # ---- optional: LLM narration (Qwen is first-priority, then these) ----
      QWEN_API_KEY: "${QWEN_API_KEY:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # ---- Bitget Signal MCP: connects to Bitget's own hosted MCP by default,
      #      no sidecar needed. Only set BITGET_MCP_URL to point at a private one. ----
      BITGET_MCP_URL: "${BITGET_MCP_URL:-}"
      # ---- optional: Bitget Agentic Account OAuth (for live UTA v3 order routing) ----
      BITGET_OAUTH_CLIENT_ID: "${BITGET_OAUTH_CLIENT_ID:-}"
      BITGET_OAUTH_CLIENT_SECRET: "${BITGET_OAUTH_CLIENT_SECRET:-}"
      BITGET_OAUTH_REDIRECT_URI: "${BITGET_OAUTH_REDIRECT_URI:-}"
      BITGET_LIVE_ENABLED: "${BITGET_LIVE_ENABLED:-0}"
      # ---- tuning ----
      RATE_RESEARCH: "60"
      NEWS_ENABLED: "1"
      NEWS_POLL_MS: "60000"
      PRICES_TICK_MS: "10000"
      LOG_LEVEL: "info"
      CORS_ORIGIN: "*"
      NIGHTWATCH_DATA_DIR: /data
      # Beta convenience: the SPA's sign-in uses email-only dev-login.
      # Remove this (and ship real auth) before taking on real users.
      ALLOW_DEV_LOGIN: "1"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # No Bitget MCP sidecar service needed here: server/providers/bitget-mcp.mjs
  # connects directly to Bitget's own hosted Signal MCP on boot. Set
  # BITGET_MCP_URL above only if you want to point at a private MCP instead.
